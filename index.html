<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melissa Monteiro — Resume</title>
  <meta
    name="description"
    content="Melissa Monteiro — M.A. Political Science graduate with experience in legal operations, case management, records administration, research, and stakeholder communication."
  />

  <style>
    :root {
      --navy: #12263f;
      --slate: #33475b;
      --muted: #64748b;
      --accent: #1f6feb;
      --accent-dark: #1656b8;
      --line: #e2e8f0;
      --bg: #f7f9fc;
      --card: #ffffff;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(18, 38, 63, 0.08);
      --max: 960px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--slate);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- Header ---------- */
    .site-header {
      background: linear-gradient(135deg, #12263f 0%, #1d3a5f 55%, #24507f 100%);
      color: #ffffff;
      padding: 56px 0 48px;
    }

    .site-header .location {
      margin: 0 0 6px;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9fc0e8;
    }

    .site-header h1 {
      margin: 0 0 20px;
      font-size: clamp(2.1rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      font-size: 0.95rem;
    }

    .contact a {
      color: #eaf2ff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .contact a:hover {
      color: #ffffff;
    }

    .contact svg {
      width: 16px;
      height: 16px;
      flex: none;
      fill: currentColor;
      opacity: 0.9;
    }

    /* ---------- Layout ---------- */
    main {
      padding: 44px 0 64px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px 32px;
      margin-bottom: 26px;
    }

    section h2 {
      margin: 0 0 20px;
      font-size: 1.25rem;
      color: var(--navy);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--line);
    }

    /* ---------- Skills ---------- */
    .skill-group {
      padding: 14px 0;
      border-bottom: 1px dashed var(--line);
    }

    .skill-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .skill-group:first-child {
      padding-top: 0;
    }

    .skill-group h3 {
      margin: 0 0 8px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-dark);
    }

    .skill-group p {
      margin: 0;
      color: var(--slate);
    }

    /* ---------- Experience ---------- */
    .job {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }

    .job:first-of-type {
      padding-top: 4px;
    }

    .job:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .job-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px 16px;
      margin-bottom: 4px;
    }

    .job-title {
      margin: 0;
      font-size: 1.08rem;
      color: var(--navy);
    }

    .job-dates {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .job-company {
      margin: 0 0 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-dark);
    }

    .job ul,
    .honors ul {
      margin: 0;
      padding-left: 20px;
    }

    .job li,
    .honors li {
      margin-bottom: 7px;
    }

    .job li:last-child,
    .honors li:last-child {
      margin-bottom: 0;
    }

    /* ---------- Education ---------- */
    .degree {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .degree:first-of-type {
      padding-top: 0;
    }

    .degree:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .degree h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      color: var(--navy);
    }

    .degree .school {
      margin: 0;
      font-weight: 600;
      color: var(--accent-dark);
    }

    .degree .meta {
      margin: 2px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      padding: 0 0 48px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 600px) {
      section {
        padding: 24px 20px;
      }

      .site-header {
        padding: 44px 0 38px;
      }
    }

    /* ---------- Print ---------- */
    @media print {
      body {
        background: #ffffff;
      }

      .site-header {
        background: #ffffff;
        color: #12263f;
        padding: 0 0 16px;
      }

      .site-header .location,
      .contact a {
        color: #33475b;
      }

      section {
        box-shadow: none;
        border: none;
        border-radius: 0;
        padding: 0;
        margin-bottom: 20px;
        break-inside: avoid;
      }

      section h2 {
        border-bottom: 1px solid #cbd5e1;
      }

      footer {
        display: none;
      }
    }
  </style>
</head>
